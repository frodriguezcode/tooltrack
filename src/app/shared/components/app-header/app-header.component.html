<div class="app-header">
  <div class="header-content">
    <div class="welcome-section">
      <h1 class="welcome-title">
        <!-- Ahora usamos userFullName que contiene Nombre y Apellido -->
        {{ pageTitle || ('dashboard.welcome' | translate) }}, {{ userFullName }}! 👋
      </h1>
      <p class="welcome-subtitle" *ngIf="pageSubtitle">
        {{ pageSubtitle | translate }}
      </p>
      <p class="welcome-subtitle" *ngIf="!pageSubtitle">
        {{ 'dashboard.welcomeMessage' | translate }}
      </p>
    </div>
    
    <div class="header-actions">
      <!-- Language Toggle Button -->
      <button 
        pButton 
        type="button"
        class="p-button-rounded p-button-text p-button-lg icon-button"
        [pTooltip]="langService.getLanguageName()"
        tooltipPosition="bottom"
        (click)="changeLanguage()">
        <fa-icon [icon]="faLanguage" [fixedWidth]="true"></fa-icon>
        <span class="flag-emoji">{{ langService.getLanguageFlag() }}</span>
      </button>
      
      <!-- Notifications Button -->
      <button 
        pButton 
        type="button"
        class="p-button-rounded p-button-text icon-button"
        pBadge 
        value="3" 
        severity="danger"
        pTooltip="Notificaciones"
        tooltipPosition="bottom">
        <fa-icon [icon]="faBell" [fixedWidth]="true"></fa-icon>
      </button>
      
      <!-- Logout Button -->
      <button 
        pButton 
        label="logout"
        type="button"
        class="p-button-rounded p-button-outlined action-button"
        (click)="logout()">
        <fa-icon [icon]="faSignOutAlt" [fixedWidth]="true" class="button-icon"></fa-icon>
        <span>{{ 'dashboard.logout' | translate }}</span>
      </button>
    </div>
  </div>
</div>
<br>
