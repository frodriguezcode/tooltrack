<p-toast></p-toast>

<div class="auth-wrapper">
  <p-card
    [header]="'login.title' | translate"
    [subheader]="'login.subtitle' | translate"
    [style]="{ width: '360px'}"
    styleClass="p-shadow-6"
  >
    <form (ngSubmit)="submit()">
      <div class="field">
        <span class="p-input-icon-left w-full">
          <i class="pi pi-key"></i>
          <input
            pInputText
            type="password"
            maxlength="6"
           
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
            placeholder="PIN"
            [(ngModel)]="pin"
            name="pin"
            class="w-full"
          />
        </span>
      </div>

      <button
        pButton
        type="submit"
       
        class="w-full mt-2"
        [loading]="loading"
        [label]="'login.enter' | translate"

      ></button>
      <button
        pButton
        type="button"
        class="w-full mt-2 p-button-text"
        (click)="useDemo()"
        [label]="'login.useDemo' | translate"
      ></button>

      <div
        class="status mt-3"
        [class.online]="online"
        [class.offline]="!online"
      >
        <!-- <i class="pi" [ngClass]="online ? 'pi-wifi' : 'pi-wifi-off'"></i> -->
        <span [class.online]="online" [class.offline]="!online">
          {{ online ? ('login.online' | translate) : ('login.offline' | translate) }}
        </span>
      </div>
    </form>
  </p-card>
</div>
