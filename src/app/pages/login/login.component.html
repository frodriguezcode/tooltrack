<div class="auth-wrapper">
  <p-card 
    [header]="'login.title' | translate"
    [subheader]="'login.subtitle' | translate"
    styleClass="p-shadow-6">
    <form (ngSubmit)="submit()">
      <div class="field">
        <span class="p-input-icon-left w-full">
          <i class="pi pi-key"></i>
          <input
            pInputText
            type="password"
            maxlength="6"
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
            [placeholder]="'login.placeholder' | translate"
            [(ngModel)]="pin"
            name="pin"
            class="w-full"
          />
        </span>
      </div>

      <button
        pButton
        type="submit"
        class="w-full mt-2"
        [loading]="loading"
        [label]="'login.enter' | translate"
      ></button>

      <button
        pButton
        type="button"
        class="w-full mt-2 p-button-text"
        (click)="signByPin()"
        [label]="'login.useDemo' | translate"
      ></button>

      <div
        class="status mt-3"
        [class.online]="online"
        [class.offline]="!online">
        <i [class]="online ? 'pi pi-wifi' : 'pi pi-wifi-off'"></i>
        <span [class.online]="online" [class.offline]="!online">
          {{ (online ? 'app.online' : 'app.offline') | translate }}
        </span>
      </div>
    </form>
  </p-card>
</div>

<p-toast></p-toast>
