<div class="card">
    <p-button 
    class=""
    (click)="showCreateUser()" label="Create User" severity="success" />
    <p-table [value]="users" [tableStyle]="{ 'min-width': '50rem','margin-top':'5px' }">
        <ng-template #header>
            <tr>
                <th>Code</th>
                <th>Name</th>
                <th>Category</th>
                <th>Quantity</th>
            </tr>
        </ng-template>
        <ng-template #body let-user>
            <tr>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
            </tr>
        </ng-template>
    </p-table>
</div>



<p-dialog header="Create User" [modal]="true" [(visible)]="visibleCreateUser" [style]="{ width: '30rem' }">

    <div class="form-grid">
        <form *ngIf="UsuarioForm" [formGroup]="UsuarioForm">
            <br>
            <div class="form-row">
                <label for="firstName">First Name</label>
                <input formControlName="firs_name" pInputText id="firstName" autocomplete="off" />
            </div>
            <br>
            <div class="form-row">
                <label for="lastName">Last Name</label>
                <input formControlName="last_name" pInputText id="lastName" autocomplete="off" />
            </div>

            <br>
            <div class="form-row relative">
                <label for="pin">Pin</label>

                <div class="relative flex-1">
                    <input [type]="showPin ? 'text' : 'password'" formControlName="pin" pInputText id="pin"
                        autocomplete="off" class="w-full pr-20" />
                    <p-button label="Change" (click)="changePin()" severity="success" size="small"
                        class="!absolute right-1 top-1/2 -translate-y-1/2"></p-button>
                </div>
            </div>

            <br>
            <div class="form-row">
                <label for="id_role">Role</label>
                <p-select [options]="role_list" formControlName="id_role" optionLabel="name" optionValue="id_rol"
                    appendTo="body" placeholder="Select a role" class="w-full"></p-select>
            </div>

        </form>
    </div>

    <div class="flex justify-end gap-2 mt-6">
        <p-button [disabled]="UsuarioForm.invalid" label="Save" (click)="saveUser();visibleCreateUser = false"></p-button>
    </div>
</p-dialog>
