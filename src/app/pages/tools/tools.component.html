<div class="card">
    <p-button 
    class=""
    (click)="createTool()" label="Create Tool" severity="success" />
    <p-table *ngIf="tools.length>0" [value]="tools" [tableStyle]="{ 'min-width': '50rem','margin-top':'5px' }">
        <ng-template #header>
            <tr>
                <th>Edit</th>
                <th>Name Tool</th>
                <th>Status</th>
                <th>Quantity</th>
            </tr>
        </ng-template>
        <ng-template #body let-tool>
            <tr>
                <td><p-button (onClick)="editTool(tool)" label="Edit" severity="info" /></td>
                <td>{{tool.name}}</td>
                
                <td *ngIf="tool.status==true"><p-button 
                 (onClick)="updateStatusTool(tool)"   
                label="deactivate" severity="danger" /></td>
                <td *ngIf="tool.status==false"><p-button
                 (onClick)="updateStatusTool(tool)"   
                label="activate" severity="success" />
                </td>   
                <td>{{tool.total_quantity}}</td>
      
            </tr>
        </ng-template>
    </p-table>
</div>


<p-dialog header="{{titleDialog}}" [modal]="true" [(visible)]="visibleCreateTool" [style]="{ width: '30rem' }">

    <div class="form-grid">
        <form>
            <br>
            <div class="form-row">
                <label for="firstName">Name Tool</label>
                <input [formControl]="name_tool" pInputText id="firstName" autocomplete="off" />
            </div>
            <br>
            <div class="form-row">
                <label for="lastName">Quantity</label>
                <input [formControl]="total_quantity" pInputText id="lastName" autocomplete="off" />
            </div>
            <br>


            <br>
 

            <br>
  

        </form>
    </div>

    <div class="flex justify-end gap-2 mt-6">
        <p-button
        [disabled]="this.name_tool.value==''"
        *ngIf="!editingTool" label="Save" (click)="saveTool();visibleCreateTool = false"></p-button>
        <p-button 
        [disabled]="this.name_tool.value==''"
        *ngIf="editingTool"  label="Save changes" (click)="updateTool();visibleCreateTool = false"></p-button>
    </div>
</p-dialog>
